name: release

# v로 시작하는 태그를 푸시하면(예: git tag v0.2.0 && git push origin v0.2.0)
# Windows에서 빌드·서명하여 GitHub Release(설치 MSI + latest.json)를 만든다.
# 설치된 앱은 다음 실행 때 latest.json을 보고 자동 업데이트한다.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Build & release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "knowledge-map ${{ github.ref_name }}"
          releaseBody: "자동 빌드 릴리스. 설치된 앱은 다음 실행 시 자동 업데이트됩니다."
          releaseDraft: false
          prerelease: false
